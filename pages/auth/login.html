<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - DroneOps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
    <link rel="stylesheet" href="../../public/css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="../../index.html" class="brand">DroneOps</a>
        <nav>
            <a href="../../index.html">Home</a>
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
            <a href="profile.html">Pilot Dashboard</a>
            <a href="../pilot/flight_request.html">New Flight Plan</a>
            <a href="../pilot/my_flights.html">My Flights</a>
            <a href="../tech/drones.html">Drone Grid</a>
            <a href="../tech/maintenance.html">Maintenance</a>
            <a href="../admin/flights.html">Flight Schedule</a>
            <a href="../admin/fleet.html">Fleet</a>
            <a href="../admin/users.html">Users</a>
            <a href="../safety/dashboard.html">Safety</a>
        </nav>
    </header>

    <main class="container">
        <h1>Crew Login</h1>
        <p class="muted">Pilots, technicians and dispatchers log in here.</p>

        <form action="#" method="post">
            <p>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </p>
            <p>
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </p>
            <p class="check">
                <input type="checkbox" id="remember" name="remember" value="1">
                <label for="remember">Remember me</label>
            </p>
            <p class="form-actions">
                <button type="submit" class="btn">Login</button>
            </p>
        </form>

        <p class="muted">New pilot? <a href="register.html">Create an account</a></p>
    </main>

    <footer class="footer">
        <p>DroneOps - Web Technologies (Lab) group project</p>
    </footer>
</body>
</html>
